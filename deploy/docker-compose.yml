# Backend (NestJS) — despliegue independiente.
# Solo es accesible dentro de la red Docker "ariz-net" (el frontend lo llama como http://ariz_backend:4000)
# y, para comprobaciones desde el servidor, en 127.0.0.1:3103. No se publica en internet.
# Antes del primer despliegue: docker network create ariz-net

name: ariz-web-backend

services:
  backend:
    build:
      context: ..
    container_name: ariz_backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: 4000
    extra_hosts:
      - "host.docker.internal:host-gateway"   # PostgreSQL instalado en el VPS
    ports:
      - "127.0.0.1:3103:4000"
    networks:
      - ariz-net

  # Herramientas de base de datos (migraciones y seed). No arranca con `up`:
  #   docker compose --profile tools run --rm migrate pnpm db:deploy
  # Usa la etapa "build" del Dockerfile, que trae Prisma, el codigo y las dependencias
  # de desarrollo (la imagen final de produccion no las incluye).
  migrate:
    profiles: ["tools"]
    build:
      context: ..
      target: build
    image: ariz-backend-tools
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ariz-net

networks:
  ariz-net:
    external: true
